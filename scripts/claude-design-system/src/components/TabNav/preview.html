<!-- @dsCard group="WordPress Elements" height=600 subtitle="Figma: Tab Nav · 2 variants" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TabNav</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var tabs = [{ label: "Editor's Picks", id: 'pv-tab-picks' }, { label: 'For You', id: 'pv-tab-fy' }];
  function sec(bp, w, note) {
    return h(I.SpecimenSection, { key: bp, title: 'Breakpoint=' + bp, note: note },
      h(I.Specimen, { items: [{ label: bp + ' (' + (bp === 'Desktop' ? '1280px bar, shown at the card width' : '360px') + ')', width: w + 32,
        node: h(NS.TabNav, { breakpoint: bp, tabs: tabs.map(function (t) { return { label: t.label, id: t.id + '-' + bp }; }), 'aria-label': 'Homepage feeds' }) }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    sec('Desktop', 1280, '640px and up: full-width color/gray/max bar; nav 1280px max, centered, 8px (spacing/100) side padding. Click a tab to select it.'),
    sec('Mobile', 360, 'Below 640px: 8px (spacing/100) nav side padding. Tabs are 24px apart.'),
    h(I.SpecimenSection, { key: 'overflow', title: 'More tabs than fit (Mobile, 360px)', note: 'The last visible tab is cut in half, never truncated; swipe or use the arrow keys to see the rest.' },
      h(I.Specimen, { items: [{ label: 'Overflow', width: 360 + 32, node: h(NS.TabNav, { breakpoint: 'Mobile', 'aria-label': 'Homepage feeds (overflow sample)',
        tabs: ["Editor's Picks", 'For You', 'News', 'Sports', 'Entertainment', 'Opinion'].map(function (l, i) { return { label: l, id: 'pv-ovf-' + i }; }) }) }] }))));
</script>
</body>
</html>
