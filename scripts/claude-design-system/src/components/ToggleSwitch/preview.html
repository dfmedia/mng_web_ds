<!-- @dsCard group="Core" height=960 subtitle="Figma: Toggle Switch · 20 variants (status × interaction × inFocus × icon)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ToggleSwitch</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}
/* The On slider is color/gray/500, the usual stage color, so this card's samples sit on color/gray/600 (Karl, 2026-11-10). */
.mngds-specimen__stage { background: var(--mng-color-gray-600) !important; }</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var COLS = [['enabled', 'Default', 'False'], ['hovered', 'hover', 'False'], ['pressed', 'pressed', 'False'], ['focused', 'Default', 'True'], ['disabled', 'disabled', 'False']];
  function row(status, icon) {
    return COLS.map(function (c) { return { label: status + (icon ? ', icon' : '') + ' / ' + c[0], node: h(NS.ToggleSwitch, { status: status, icon: icon, interaction: c[1], inFocus: c[2], 'aria-label': status + ' ' + c[0] }) }; });
  }
  var LBL = { display: 'flex', alignItems: 'center', fontFamily: 'var(--mng-font-family-noto-sans)', fontSize: 'var(--mng-font-size-14)', color: 'var(--mng-color-gray-min)' };
  function Demo(p) {
    var s = React.useState(!!p.on);
    return h('label', { style: LBL },
      h(NS.ToggleSwitch, { status: s[0] ? 'selected' : 'unselected', icon: p.icon, onChange: function (e) { s[1](e.target.checked); } }), 'Email me breaking news alerts');
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h(I.SpecimenSection, { title: 'status × interaction', note: 'A 48x24 slider in a 64x40 touch area (radius/utility). Off: white slider, gray/400 border, gray/300 handle. On: gray/500 slider, color/theme/primary handle. Hover and pressed darken the handle (gray/200, primary-darker). Focus shows a 2px gray/black ring around the handle. Samples sit on gray/600 because the On slider is gray/500.' },
      [['unselected', false], ['unselected', true], ['selected', false], ['selected', true]].map(function (r) { return h(I.Specimen, { key: r[0] + r[1], items: row(r[0], r[1]) }); })),
    h(I.SpecimenSection, { title: 'Try it', note: 'Click, or Tab to it and press Space. The switch and the first line of the label are center-aligned, with no gap after the 64x40 touch area.' },
      h(I.Specimen, { items: [{ label: 'Off, with a label', node: h(Demo) }, { label: 'On, with the handle icon', node: h(Demo, { on: true, icon: true }) }] }))));
</script>
</body>
</html>
