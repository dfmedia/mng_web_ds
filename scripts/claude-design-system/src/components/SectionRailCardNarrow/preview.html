<!-- @dsCard group="WordPress Elements" height=900 subtitle="Figma: Section Rail Card Narrow · 2 variants (Device = production breakpoint)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SectionRailCardNarrow</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var devices = [['(≤799px)', 340, 'Section Title'], ['(≥800px)', 300, 'Sports']];
  var variants = h(I.SpecimenSection, { title: 'Device', note: 'Production’s breakpoint for this card (identical on all 6 review sites): below 800px the lead has a rule under it, from 800px it doesn’t. Otherwise only the width changes (100% below 640px, 50% at 640–1039px, 25% from 1040px). Drawn at the Figma widths; the card fills its column.' },
    h(I.Specimen, { items: devices.map(function (d) {
      return { label: 'Device=' + d[0] + ' (built ' + d[1] + 'px)', width: d[1] + 32, node: h('div', { style: { width: d[1] } }, h(NS.SectionRailCardNarrow, { device: d[0], title: d[2] })) };
    }) }));
  ReactDOM.createRoot(document.getElementById('root')).render(variants);
</script>
</body>
</html>
