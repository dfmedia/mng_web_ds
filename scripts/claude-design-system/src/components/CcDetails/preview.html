<!-- @dsCard group="Core" height=520 subtitle="Figma: Form Field Assembly / CC details · 2 variants (Size)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CC details</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h(I.SpecimenSection, { title: 'Size', note: "Card Number (optional: showCardNumber), then Exp. Date, CVV and Zip Code, each sized to its content. Desktop 16px gaps; Mobile 8px gaps and 4px between rows." },
      h(I.Specimen, { items: [
        { label: 'Desktop', width: 512, node: h(NS.CcDetails, { size: 'Desktop' }) },
        { label: 'Mobile', width: 360, node: h(NS.CcDetails, { size: 'Mobile' }) }] })),
    h(I.SpecimenSection, { title: 'Shared error', note: 'The field in error keeps its red outline; the message shows once, under the group.' },
      h(I.Specimen, { items: [
        { label: 'Desktop, Show error', width: 512, node: h(NS.CcDetails, { showError: true, errorMessage: 'Enter your card number.',
          fields: { number: { state: 'Error', showValue: false, showPlaceholder: true } } }) }] }))));
</script>
</body>
</html>
