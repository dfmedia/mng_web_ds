<!-- @dsCard group="WordPress Elements" height=2960 subtitle="Figma: Zone 1 Lead Article Card · 6 variants (Style × Device × Gallery)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Zone1LeadArticleCard</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var stage = { Desktop: 700 + 32, Tablet: 748 + 32, Mobile: 340 + 32 };
  var notes = {
    Desktop: '1280px and up on the homepage: fills its column. Text 43.75% | image 56.25%, 20px apart (built 296 | 384 × 256 at 700), or text 43.75% | Zone 1 Slideshow 50%. Photo 3:2. Headline Bold 29/33 in the theme’s heading font (Noto Serif; Noto Sans in Modern Earthy).',
    Tablet: '640–799px: fills its column. Text and image 50% each, 20px apart (built 364 | 364 × 243 at 748); the slideshow fills its half. Photo 3:2.',
    Mobile: 'Below 640px (and any lead narrower than about 700px): one column, 8px gaps, 25/29 headline; image under the headline, slideshow after the Related list; 1px color/gray/500 rule at the bottom. Photo 3:2 (340 × 227). Built at 340px; fills its container.'
  };
  function section(dev) {
    var items = ['Image', 'Slideshow'].map(function (g) {
      return { label: 'Standard / ' + dev + ' / ' + g, width: stage[dev],
        node: h(NS.Zone1LeadArticleCard, { device: dev, gallery: g }) };
    });
    return h(I.SpecimenSection, { key: dev, title: 'Device=' + dev, note: notes[dev] }, h(I.Specimen, { items: items }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null, section('Desktop'), section('Tablet'), section('Mobile')));
</script>
</body>
</html>
