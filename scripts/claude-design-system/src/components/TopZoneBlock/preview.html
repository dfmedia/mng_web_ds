<!-- @dsCard group="WordPress Elements" height=7600 subtitle="Figma: TOP ZONE Block · 5 variants (Device = production breakpoints)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TopZoneBlock</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var devices = [['XS (≤639px)', 340], ['S (640–799px)', 748], ['M (800–1039px)', 989], ['L (1040–1279px)', 1065], ['XL (≥1280px)', 1260]];
  var variants = h(I.SpecimenSection, { title: 'Device', note: 'Production’s breakpoints (the same on all 6 review sites): stacked below 800px (story cards 2 per row from 640px); from 800px the lead column and Latest Headlines sit beside the ad column (no gap at 800–1039px, as production; 20px from 1040px, with 32px below). Drawn at the Figma widths; the block fills its row.' },
    h(I.Specimen, { items: devices.map(function (d) {
      return { label: 'Device=' + d[0] + ' (built ' + d[1] + 'px)', width: d[1] + 32, node: h('div', { style: { width: d[1] } }, h(NS.TopZoneBlock, { device: d[0] })) };
    }) }));
  ReactDOM.createRoot(document.getElementById('root')).render(variants);
</script>
</body>
</html>
