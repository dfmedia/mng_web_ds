<!-- @dsCard group="WordPress Elements" height=260 subtitle="Figma: Blueconic List Item · 2 variants" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BlueconicListItem</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var devices = [['(≤1039px)', 340], ['(≥1040px)', 459]];
  var variants = h(I.SpecimenSection, { title: 'Device', note: 'One numbered headline in the Blueconic Block, built raw in production’s values (a Blueconic block). Production changes the line height and letter spacing at 1040px. Drawn at the Figma widths; the item fills its column.' },
    h(I.Specimen, { items: devices.map(function (d) {
      return { label: 'Device=' + d[0] + ' (built ' + d[1] + 'px)', width: d[1] + 32, node: h('div', { style: { width: d[1] } }, h(NS.BlueconicListItem, { device: d[0] })) };
    }) }));
  ReactDOM.createRoot(document.getElementById('root')).render(variants);
</script>
</body>
</html>
