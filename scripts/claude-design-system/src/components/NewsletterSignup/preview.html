<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NewsletterSignup</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var devices = [['(≤799px)', 340, 'full width'], ['(≥800px)', 226, 'side column']];
  var variants = h(I.SpecimenSection, { title: 'Device', note: 'The newsletter prompt at the end of Latest Headlines (anonymous view). Production has no breakpoint for this block: both variants draw the same layout, at the two widths Latest Headlines uses. The button is Button Primary.' },
    h(I.Specimen, { items: devices.map(function (d) {
      return { label: 'Device=' + d[0] + ' (' + d[2] + ', built ' + d[1] + 'px)', width: d[1] + 32, node: h('div', { style: { width: d[1] } }, h(NS.NewsletterSignup, { device: d[0] })) };
    }) }));
  ReactDOM.createRoot(document.getElementById('root')).render(variants);
</script>
</body>
</html>
