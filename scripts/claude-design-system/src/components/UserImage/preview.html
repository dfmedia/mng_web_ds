<script>

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    ['small', 'medium', 'large'].map(function (s) {
      return h(I.SpecimenSection, { key: s, title: 'Size = ' + s + ' (' + { small: 32, medium: 40, large: 64 }[s] + 'px)', note: s === 'small' ? 'The masthead avatar (production 30px). Initials are about 40% of the circle; the monogram colors and the photo change by reader (sample art here).' : null },

    })));
