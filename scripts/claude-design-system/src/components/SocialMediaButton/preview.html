<!-- @dsCard group="WordPress Elements" height=760 subtitle="Figma: Social Media Button · 120 variants (Network × Theme × interaction × inFocus)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SocialMediaButton</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}
.demo-row{display:flex;gap:8px;align-items:center;}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var NETS = ['Facebook', 'Bluesky', 'Reddit', 'X', 'Print', 'Email', 'LinkedIn', 'Link', 'Gift', 'Share more'];
  var THEMES = [['bold-coastal', 'Bold Coastal'], ['measured-vibrant', 'Measured Vibrant'], ['modern-earthy', 'Modern Earthy']];
  var STATES = [['default', 'Default', 'False'], ['hover', 'hover', 'False'], ['pressed', 'pressed', 'False'], ['focused', 'Default', 'True']];
  function rows(t) {
    return STATES.map(function (s) {
      return { label: t[1] + ' · ' + s[0], white: true, node: h('div', { 'data-theme': t[0], className: 'demo-row' },
        NETS.map(function (n) { return h(NS.SocialMediaButton, { key: n, network: n, theme: t[1], interaction: s[1], inFocus: s[2], tabIndex: -1 }); })) };
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h(I.SpecimenSection, { title: 'Network × Theme × interaction', note: '40x40 round, 18px icons (gift 22px), matching production. Bold Coastal: filled color/theme/primary, hover primary-light. Measured Vibrant: 1px primary-dark outline, primary icon; hover fills primary. Modern Earthy: 2px outline in the network\'s current brand color (Facebook #1877F2, Bluesky #1185FE, Reddit #FF4500, X black, LinkedIn #0A66C2; the rest color/theme/primary); hover fills it. Focus: a 2px gray/black ring 1px outside. Each row is forced to its theme with data-theme.' },
      THEMES.map(function (t) { return h(I.Specimen, { key: t[0], items: rows(t) }); }))));
</script>
</body>
</html>
